name: Experiment 19 - Docker CD Pipeline
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t exp19-cd-app:${{ github.run_number }} .
      - name: Run Container Verification Test
        run: docker run --rm exp19-cd-app:${{ github.run_number }}
      - name: Docker Hub Publish (if configured)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Deployment Summary
        run: echo "Image exp19-cd-app:${{ github.run_number }} built and verified on GitHub Actions." >> $GITHUB_STEP_SUMMARY
